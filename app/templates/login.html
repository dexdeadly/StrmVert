{% extends "base.html" %}
{% block title %}Sign in · StrmVert{% endblock %}
{% block content %}
<div style="max-width: 360px; margin: 8vh auto 0;">
  <h1>Strm<span style="color:var(--accent)">V</span>ert</h1>
  <p class="muted">Sign in to continue.</p>
  {% if error %}<div class="banner err">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="panel stack">
    <input type="hidden" name="next" value="{{ next }}">
    {% if needs_username %}
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" autofocus required>
    </div>
    {% endif %}
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password"
             {{ '' if needs_username else 'autofocus' }} required>
    </div>
    <button class="btn btn-primary" type="submit" style="width:100%">Sign in</button>
  </form>
</div>
{% endblock %}
