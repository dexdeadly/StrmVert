{% extends "base.html" %}
{% block title %}Movies · StrmVert{% endblock %}
{% block content %}
<div x-data="library()">
  <h1>Movies</h1>

  <form id="filter-form" class="filters"
        hx-get="/movies" hx-target="#results" hx-push-url="true"
        hx-trigger="change, keyup delay:450ms from:input[name='q']">
    {% include "partials/movie_filters.html" %}
  </form>

  <div id="results"
       data-tab="movies" data-view="{{ filters.view }}"
       data-page-url="/movies" data-qs-noview="{{ qs_noview }}">
    {% include "partials/movie_results.html" %}
  </div>

  <div class="actionbar" x-show="count > 0" x-cloak>
    <span class="count" x-text="count + ' selected'"></span>
    <button type="button" class="btn btn-sm btn-ghost" @click="clear()">Clear</button>
    <div class="spacer"></div>
    <button type="button" class="btn btn-primary" @click="submit()" :disabled="busy">
      <span x-show="!busy">Create .strm files</span>
      <span x-show="busy" x-cloak>Working…</span>
    </button>
  </div>

  <template x-if="detailOpen">
    <div class="drawer-backdrop" @click.self="detailOpen = false" @keydown.escape.window="detailOpen = false">
      <div class="drawer" x-html="detailHtml"></div>
    </div>
  </template>
</div>
<script>document.addEventListener('DOMContentLoaded', restoreView);</script>
{% endblock %}
