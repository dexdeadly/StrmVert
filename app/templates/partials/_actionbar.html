<div class="actionbar" x-show="count > 0" x-cloak>
  <span class="count"
        x-text="(counts.movies ? counts.movies + ' movie' + (counts.movies === 1 ? '' : 's') : '')
          + (counts.movies && counts.tv ? ' · ' : '')
          + (counts.tv ? counts.tv + ' TV item' + (counts.tv === 1 ? '' : 's') : '')
          + ' selected'"></span>
  <button type="button" class="btn btn-sm btn-ghost" @click="clear()">Clear</button>
  {% if active == 'tv' %}
    <span class="muted" style="font-size:.8rem">whole-series picks expand to every episode on write</span>
  {% endif %}
  <div class="spacer"></div>
  <button type="button" class="btn btn-primary" @click="submit()" :disabled="busy">
    <span x-show="!busy">Create .strm files</span>
    <span x-show="busy" x-cloak>Working…</span>
  </button>
</div>
