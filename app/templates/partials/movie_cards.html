<div class="grid">
  {% for m in movies %}
    {% set tok = 'm:' ~ m.id %}
    <article class="card" :class="{ selected: has('{{ tok }}') }" @click="toggle('{{ tok }}')">
      <div class="pick" x-show="has('{{ tok }}')" x-cloak>✓</div>
      {% if m.id in exported_ids %}<div class="exported-tag">STRM</div>{% endif %}
      {% if m.poster_url %}
        <img class="poster" loading="lazy" referrerpolicy="no-referrer" src="{{ m.poster_url }}" alt=""
             onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'poster',textContent:'No art'}))">
      {% else %}
        <div class="poster">No art</div>
      {% endif %}
      <div class="meta">
        <div class="title">{{ m.title_clean or m.name }}</div>
        <div class="sub">
          {% if m.year %}<span>{{ m.year }}</span>{% endif %}
          <span>{{ m.server.name }}</span>
          <a @click.stop="openDetail('/movies/{{ m.id }}')" style="color:var(--accent);cursor:pointer">info</a>
        </div>
      </div>
    </article>
  {% endfor %}
</div>
