<div class="field grow">
  <label for="f-q">Search</label>
  <input type="search" id="f-q" name="q" value="{{ filters.q }}" placeholder="Title…" autocomplete="off">
</div>
{% include "partials/_server_category_fields.html" %}
<div class="field small">
  <label for="f-sort">Sort</label>
  <select id="f-sort" name="sort">
    <option value="name" {{ 'selected' if filters.sort == 'name' }}>Title A–Z</option>
    <option value="year_desc" {{ 'selected' if filters.sort == 'year_desc' }}>Year ↓</option>
    <option value="year_asc" {{ 'selected' if filters.sort == 'year_asc' }}>Year ↑</option>
    <option value="added_desc" {{ 'selected' if filters.sort == 'added_desc' }}>Recently added</option>
  </select>
</div>
<div class="field small">
  <label for="f-ps">Per page</label>
  <select id="f-ps" name="page_size">
    {% for n in [25, 50, 100] %}
      <option value="{{ n }}" {{ 'selected' if filters.page_size == n }}>{{ n }}</option>
    {% endfor %}
  </select>
</div>
<div class="check" style="padding-bottom:.45rem">
  <input type="checkbox" id="f-hide" name="hide_exported" value="true" {{ 'checked' if filters.hide_exported }}>
  <label for="f-hide">Hide exported</label>
</div>
