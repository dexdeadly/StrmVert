{% extends "base.html" %}
{% block title %}TV Shows · StrmVert{% endblock %}
{% block content %}
<div x-data="library()">
  <h1>TV Shows</h1>

  <form id="filter-form" class="filters"
        hx-get="/tv" hx-target="#results" hx-push-url="true"
        hx-trigger="change, keyup delay:450ms from:input[name='q']">
    <div class="field grow">
      <label for="f-q">Search</label>
      <input type="search" id="f-q" name="q" value="{{ filters.q }}" placeholder="Show…" autocomplete="off">
    </div>
    {% include "partials/_server_category_fields.html" %}
    <div class="field small">
      <label for="f-sort">Sort</label>
      <select id="f-sort" name="sort">
        <option value="name" {{ 'selected' if filters.sort == 'name' }}>Title A–Z</option>
        <option value="year_desc" {{ 'selected' if filters.sort == 'year_desc' }}>Year ↓</option>
        <option value="recent" {{ 'selected' if filters.sort == 'recent' }}>Recently updated</option>
      </select>
    </div>
    <div class="field small">
      <label for="f-ps">Per page</label>
      <select id="f-ps" name="page_size">
        {% for n in [25, 50, 100] %}
          <option value="{{ n }}" {{ 'selected' if filters.page_size == n }}>{{ n }}</option>
        {% endfor %}
      </select>
    </div>
  </form>

  <div id="results"
       data-tab="tv" data-view="{{ filters.view }}"
       data-page-url="/tv" data-qs-noview="{{ qs_noview }}">
    {% include "partials/series_results.html" %}
  </div>

  {% include "partials/_actionbar.html" %}

  <template x-if="detailOpen">
    <div class="drawer-backdrop" @click.self="detailOpen = false" @keydown.escape.window="detailOpen = false">
      <div class="drawer" x-html="detailHtml"></div>
    </div>
  </template>
</div>
<script>document.addEventListener('DOMContentLoaded', restoreView);</script>
{% endblock %}
